name: CI

# Pull requests are tested as they would merge; main is tested after each merge. Other branch
# pushes aren't, since their pull request covers them (run it by hand to test a branch early).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request makes its older run pointless, so that run is cancelled. Runs
# on main all finish, so each merge gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # clang and lld cross-compile the example programs that run as integration tests.
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang lld

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja llvm lld

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          pip install clang-format==23.1.3
          clang-format --dry-run --Werror $(git ls-files '*.h' '*.cpp' '*.c')
